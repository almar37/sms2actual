services:
  actual-sms:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000'
    volumes:
      - sms-data:/data
      - actual-cache:/actual-cache
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/readyz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
volumes:
  sms-data:
  actual-cache:
