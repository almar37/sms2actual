templates:
  - id: alrajhi-own-transfer
    match:
      - source: 'حوالة بين حساباتك'
        flags: u
    kind: transfer_out
    fields: {}
    required: [principal, from, to]
  - id: alrajhi-online-purchase
    match:
      - source: '^شراء\s+[إا]نترنت\s+بـ?'
        flags: u
    kind: purchase
    fields:
      principal:
        - source: '^شراء\s+[إا]نترنت\s+بـ?\s*(?:SAR|SR|ر\.?س\.?)\s*(?<value>\d+(?:\.\d{1,2})?)(?=\s|\\n|$)'
          flags: iu
      accountAlias: &alrajhiCompactAccount
        - source: '(?:^|\s|\\n)عبر\s*[:：]?\s*[*xX-]*(?<value>\d{3,6})(?=\s|[;؛]|$)'
          flags: iu
      merchant:
        - &labelledMerchant
          source: '(?:^|\s)(?:merchant(?=[ \t:：])|at(?=[ \t:：])|entity(?=[ \t:：])|لدى|لـ|الجهة)[ \t]*[:：]?[ \t]*(?<value>[^\s\n][^\n]*?)(?=[ \t]*(?:\n|$)|[ \t]+(?:(?:total\s+due\s+amount|total\s+amount|amount|(?:available\s+|current\s+)?balance|country|fees?(?:\s*(?:&|and)\s*vat)?|exchange\s+rate|رصيد|الرصيد(?:\s+المتاح)?|مبلغ|المبلغ|رسوم|الرسوم(?:\s*والضريبة)?)[ \t]*[:：~]|(?:on|date|في|بتاريخ)?[ \t]*\d{1,4}[-/]\d{1,2}[-/]\d{1,4}(?:[ T]\d{1,2}:\d{2})?))'
          flags: iu

      balance:
        - source: '(?:^|\s|\\n)(?:الرصيد|رصيد)\s*[:：]\s*(?:SAR|SR|ر\.?س\.?)?\s*(?<value>\d+(?:\.\d{1,2})?)(?=\s|\\n|$)'
          flags: iu
    required: [principal, accountAlias, merchant]
  - id: alrajhi-card-payment-received
    match:
      - source: '^بطاقة\s+فيزا\s*[:：]\s*سداد(?=\s|$)'
        flags: u
    kind: transfer_in
    cardPaymentReceived: true
    fields:
      principal:
        - source: '^بطاقة\s+فيزا\s*[:：]\s*سداد\s+بـ?\s*(?:SAR|SR|ر\.?س\.?)\s*(?<value>\d+(?:\.\d{1,2})?)(?=\s|\\n|$)'
          flags: iu
      accountAlias:
        - source: '(?:^|\s|\\n)عبر\s*[:：]?\s*[*xX-]*(?<value>\d{3,6})(?!\d)'
          flags: iu
      balance:
        - source: '(?:^|\s|\\n)(?:الرصيد|رصيد)\s*[:：]\s*(?:SAR|SR|ر\.?س\.?)?\s*(?<value>\d+(?:\.\d{1,2})?)(?=\s|\\n|$)'
          flags: iu
    required: [principal, accountAlias]
  - id: alrajhi-compact-pos-purchase
    match:
      - source: '^شراء\s+POS(?=\s|$)'
        flags: iu
    kind: purchase
    fields:
      accountAlias: *alrajhiCompactAccount
      principal:
        - source: '(?:^|\s)بـ?\s*[:：]?\s*(?<value>\d+(?:\.\d{1,2})?)\s*(?:SAR|SR|ر\.?س\.?)(?=\s|$)'
          flags: iu
        - source: '(?:^|\s)بـ?\s*[:：]?\s*(?:SAR|SR|ر\.?س\.?)\s*(?<value>\d+(?:\.\d{1,2})?)(?=\s|$)'
          flags: iu
      merchant: [*labelledMerchant]
    required: [principal, accountAlias, merchant, date]
  - id: alrajhi-card-purchase
    match:
      - source: '^(?:POS(?: Purchase)?|(?:Online|Internet|Card|E-?commerce) Purchase|Purchase|شراء عبر نقاط البيع|شراء عبر الإنترنت)(?=\s|$)'
        flags: iu
    kind: purchase
    fields:
      merchant: [*labelledMerchant]
    required: [merchant]
  - id: alrajhi-card-refund
    match:
      - source: '^(?:Reverse Transaction|Refund|عكس عملية|استرداد)(?=\s|$)'
        flags: iu
    kind: refund
    fields:
      merchant: [*labelledMerchant]
    required: [merchant]
