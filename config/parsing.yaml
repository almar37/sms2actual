    sarEquivalent:
      - source: (?:(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY)\s*[\d,.]+|[\d,.]+\s*(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY))\s*\(\s*(?:SAR|SR)\s*(?<value>[\d,.]+)\s*\)
        flags: iu
      - source: (?:(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY)\s*[\d,.]+|[\d,.]+\s*(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY))\s*\(\s*(?<value>[\d,.]+)\s*(?:SAR|SR)\s*\)
        flags: iu
    foreign:
      - source: (?<currency>(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY))\s*(?<amount>[\d,.]+)|(?<trailingAmount>[\d,.]+)\s*(?<trailingCurrency>(?:USD|EUR|GBP|AED|KWD|BHD|QAR|JPY))
